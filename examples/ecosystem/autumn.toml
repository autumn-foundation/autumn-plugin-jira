# The autumn app of the ecosystem example. It holds names, never secrets.
# `TestApp` reads the `[san_mateo]` and `[jira]` sections of this file, and
# sets the same `[security.csrf]` values in code. The boot test adds the
# webhook endpoint and `[harvest]` to a copy, and runs the app with `run()`.

[security.csrf]
enabled = true
# San Mateo clients send a secret key or a connect session token, not a CSRF
# cookie. San Mateo checks its own tokens on these routes.
exempt_paths = ["/san-mateo"]

[san_mateo]
# It ends with the route prefix of the plugin.
server_url = "https://ops.example/san-mateo"

[jira.san_mateo]
environment = "ops"
integration = "jira"
connection_id = "acme"

[jira.webhook]
# The bot account makes the API writes of the flow. Its own deliveries give
# 200 and a counter, and no sink runs.
ignore_actor_account_ids = ["acct-bot"]
