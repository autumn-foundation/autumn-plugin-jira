[workspace]
members = [
    "crates/autumn-jira",
    "crates/autumn-jira-fake",
    "crates/autumn-plugin-jira",
    "crates/autumn-jira-harvest",
    "crates/autumn-jira-camel",
]
# The ecosystem example is its own workspace. See ADR 0008.
exclude = ["examples/ecosystem"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.89"
version = "0.2.0"
license = "Apache-2.0"
repository = "https://github.com/autumn-foundation/autumn-plugin-jira"

[workspace.dependencies]
# This workspace.
autumn-jira = { version = "0.2.0", path = "crates/autumn-jira" }
autumn-jira-fake = { version = "0.2.0", path = "crates/autumn-jira-fake" }
# The ecosystem. Keep one version of each in the lock (CI job `deps`).
san-mateo = "0.1"
autumn-plugin-san-mateo = "0.3"
autumn-web = { version = "0.10", default-features = false }
autumn-harvest = "0.10.0"
camel-api = "0.57"
camel-component-api = "0.57"
camel-core = "0.57"
camel-builder = "0.57"
camel-component-direct = "0.57"
# Others.
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
data-encoding = "2"
deadpool = "0.13"
diesel-async = { version = "0.9", features = ["deadpool", "postgres"] }
hmac = "0.12"
percent-encoding = "2"
proptest = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "0.9"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
# `pub(crate)` marks crate-internal items on purpose.
redundant_pub_crate = "allow"
# Names such as `autumn_jira::client::JiraClient` are clear.
module_name_repetitions = "allow"

# Small debug info keeps the build directory small. Coverage does not need
# it: llvm-cov reads its own instrumentation.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# autumn-plugin-san-mateo 0.3 (on autumn-web 0.10) is not on crates.io yet.
# The patch takes all San Mateo crates from one git commit, so the lock has
# one `san-mateo`. Remove it after the release.
[patch.crates-io]
san-mateo = { git = "https://github.com/autumn-foundation/san-mateo", branch = "claude/project-thread-8btuvj" }
autumn-plugin-san-mateo = { git = "https://github.com/autumn-foundation/san-mateo", branch = "claude/project-thread-8btuvj" }
